# Construction Site Analysis Prompt Configuration
# This prompt is used for analyzing daily construction site images

[metadata]
version = "1.0"
description = "Main construction site analysis prompt"
author = "Progress Monitoring System"

[construction_analysis]
type = "analysis"
model_name = "gemini-2.5-pro"
temperature = 0.7
max_tokens = 4000
top_p = 1.0
frequency_penalty = 0.0
presence_penalty = 0.0
description = "Comprehensive construction site analysis with historical context"

template = """
INSTRUCTIONS: Provide a direct, professional construction site analysis. Do not include conversational phrases, greetings, or commentary. Start immediately with factual observations using the structure below.

ANALYSIS DATE: ${analysis_date}
PROJECT CONTEXT:
- Current phase: ${current_phase}
- Days analyzed: ${total_days_analyzed}
- Overall progress: ${overall_progress_percentage}%
- Project start: ${project_start_date}

${historical_context}

REQUIRED ANALYSIS STRUCTURE:

**1. DAILY ACTIVITIES**
Document specific construction work performed today.

**2. PROGRESS ACCOMPLISHED**
List specific accomplishments and completions.

**3. KEY OBSERVATIONS**
Notable changes, installations, and issues.

**4. SAFETY ASSESSMENT**
Safety practices, violations, and concerns.

**5. EQUIPMENT & PERSONNEL**
Visible equipment, tools, and workforce details.

**6. QUALITY CONTROL**
Work quality assessment and standards compliance.

**7. WEATHER IMPACT**
How conditions affected work progress.

**8. TIMELINE STATUS**
Project schedule assessment.

**COMPARATIVE ANALYSIS**
Compare with previous progress using concrete observations and measurable indicators.

Format your response using the above headings with concise, factual content under each section.
"""

[construction_analysis_openai]
type = "analysis"
model_name = "gpt-4o"
temperature = 0.7
max_tokens = 4000
top_p = 1.0
frequency_penalty = 0.0
presence_penalty = 0.0
description = "Comprehensive construction site analysis optimized for OpenAI models"

