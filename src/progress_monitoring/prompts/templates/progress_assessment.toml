# Progress Assessment Prompt Configuration
# This prompt is used for generating structured progress reports

[metadata]
version = "1.0"
description = "Progress assessment and structured reporting prompts"
author = "Progress Monitoring System"

[progress_assessment]
type = "progress_assessment"
model_name = "gemini-2.5-pro"
temperature = 0.5
max_tokens = 2000
top_p = 1.0
frequency_penalty = 0.0
presence_penalty = 0.0
description = "Generate structured progress assessment from analysis text"

template = """
INSTRUCTIONS: Generate a structured progress assessment from the analysis below. Respond with ONLY valid JSON - no explanatory text, comments, or markdown formatting.

PROJECT CONTEXT:
- Days analyzed so far: ${total_days_analyzed}
- Previous overall progress: ${previous_progress}%
- Current project phase: ${current_phase}

ANALYSIS TEXT:
${analysis_text}

JSON REQUIREMENTS:
1. **current_phase**: Phase of construction currently active (consider context: ${current_phase}). Consider the analysis text to determine the current phase.
2. **overall_progress_percentage**: New overall project completion percentage (0-100%) based on analysis and previous progress of ${previous_progress}%
3. **daily_progress_percentage**: Progress made today specifically
4. **key_accomplishments**: List 3-5 major accomplishments from today's work
5. **identified_issues**: Problems, delays, or concerns noted
6. **next_phase_indicators**: Signs indicating movement toward next construction phase
7. **estimated_timeline_status**: "On Schedule", "Ahead of Schedule", or "Behind Schedule"
8. **critical_path_items**: Key items that could affect project timeline

Respond with ONLY this exact JSON format:
{
    "current_phase": "Phase name",
    "overall_progress_percentage": 50,
    "daily_progress_percentage": 5,
    "key_accomplishments": ["accomplishment 1", "accomplishment 2"],
    "identified_issues": ["issue 1", "issue 2"],
    "next_phase_indicators": ["indicator 1", "indicator 2"],
    "estimated_timeline_status": "On Schedule",
    "critical_path_items": ["item 1", "item 2"]
}
"""

[progress_assessment.variables]
analysis_text = ""
total_days_analyzed = 0
previous_progress = 0
current_phase = "Unknown"

[progress_assessment_openai]
type = "progress_assessment"
model_name = "gpt-4o"
temperature = 0.4
max_tokens = 2000
top_p = 0.9
