[project]
name = "progress-monitoring"
version = "0.1.0"
description = "AI-powered construction progress monitoring using computer vision"
authors = [
    {name = "afschowdhury",email = "afschowdhury@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "opencv-python (>=4.11.0.86,<5.0.0.0)",
    "google-genai (>=1.3.0,<2.0.0)",
    "openai (>=1.0.0,<2.0.0)",
    "python-dotenv (>=1.0.0,<2.0.0)",
    "ipykernel (>=6.29.5,<7.0.0)",
    "pydantic (>=2.11.7,<3.0.0)",
    "qdrant-client (>=1.11.0,<2.0.0)",
    "sentence-transformers (>=3.0.0,<4.0.0)",
    "icecream (>=2.1.0,<3.0.0)",
    "toml (>=0.10.0,<1.0.0)"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "flake8>=6.0.0",
    "mypy>=1.0.0"
]

[project.scripts]
progress-monitor = "progress_monitoring.cli:main"

[tool.poetry]
packages = [{include = "progress_monitoring", from = "src"}]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
